# Notraius lookup exposure.
#
# Governance rules:
#   - Reference data is READ-ONLY through this API. Writes belong to
#     migrations / seed tooling.
#   - The activity registry (activities) arrives from shared.yaml via the
#     classpath* scan — never redeclared here: the loader fails loudly on
#     duplicate table names.
#   - Definitions arrive as the notraius domain grows.
definitions:
  - tableName: entities
    repositoryBeanName: entitiesRepository
    entityClassName: com.notraius.database.entities.reference.Entities
    description: Notraius entity codes (reference list; authenticated reads)
    methods:
      PERSONAL:
        - findAll
        - findById
        - findByCode

  - tableName: plan_features
    repositoryBeanName: subscriptionPlanFeatureRepository
    entityClassName: org.primarion.module.subscription.database.entities.PlanFeature
    description: Feature bindings per plan (limit + unit; admin-writable)
    methods:
      UNAUTHENTICATED:
        - findAll
        - findById
        - findByPlanId
      ADMIN:
        - save
        - deleteById

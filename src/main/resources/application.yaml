spring:
  config:
    import: classpath:endpoints.yaml
  application:
    name: ${APP_NAME:springboot.notraius}

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASS}
    driver-class-name: org.postgresql.Driver
    hikari:
      # #CTR-91: Pool must accommodate Tomcat thread count.
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE}
      minimum-idle: ${HIKARI_MIN_IDLE}
      connection-timeout: ${HIKARI_CONNECTION_TIMEOUT}
      idle-timeout: ${HIKARI_IDLE_TIMEOUT}
      max-lifetime: ${HIKARI_MAX_LIFETIME}
      validation-timeout: ${HIKARI_VALIDATION_TIMEOUT}

  jpa:
    hibernate:
      # Flyway owns the schema; Hibernate never generates DDL.
      ddl-auto: none
    open-in-view: false
    show-sql: ${APP_SHOW_SQL}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        globally_quoted_identifiers: true
        jdbc.time_zone: UTC
        # Notraius domain entities carry an explicit @Table schema; the shared
        # Attachment row model (no @Table schema) lands in the notraius schema.
        # Geo reference entities (states, countries) and the Media catalog are
        # served by the shared lookup datasource (app.shared.datasource).
        default_schema: notraius

  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: notraius
    default-schema: notraius
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: false

  data:
    jpa:
      repositories:
        enabled: false
    redis:
      repositories:
        enabled: false

  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE}
      max-request-size: ${MAX_REQUEST_SIZE}

springdoc:
  api-docs:
    path: ${SPRINGDOC_API_DOCS_PATH}
    # Off unless explicitly enabled (SPRINGDOC_ENABLED=true).
    enabled: ${SPRINGDOC_ENABLED:false}
  swagger-ui:
    path: ${SPRINGDOC_SWAGGER_UI_PATH}
    deep-linking: ${SPRINGDOC_SWAGGER_UI_DEEP_LINKING}
    display-request-duration: ${SPRINGDOC_SWAGGER_UI_DISPLAY_REQUEST_DURATION}
    syntax-highlight:
      activated: ${SPRINGDOC_SWAGGER_UI_SYNTAX_HIGHLIGHT}
    tags-sorter: ${SPRINGDOC_SWAGGER_UI_TAGS_SORTER}
    operations-sorter: ${SPRINGDOC_SWAGGER_UI_OPERATIONS_SORTER}
    doc-expansion: ${SPRINGDOC_SWAGGER_UI_DOC_EXPANSION}
    filter: ${SPRINGDOC_SWAGGER_UI_FILTER}
    show-extensions: ${SPRINGDOC_SWAGGER_UI_SHOW_EXTENSIONS}

server:
  port: ${PORT}
  shutdown: graceful
  max-http-request-header-size: ${MAX_HTTP_REQUEST_HEADER_SIZE}
  tomcat:
    threads:
      max: ${TOMCAT_MAX_THREADS}
      min-spare: ${TOMCAT_MIN_SPARE_THREADS}
    max-connections: ${TOMCAT_MAX_CONNECTIONS}
    accept-count: ${TOMCAT_ACCEPT_COUNT}
    connection-timeout: ${TOMCAT_CONNECTION_TIMEOUT}

app:
  app-code: ${APP_CODE}

  lookup:
    basePath: /api/v1/lookups
    dir: classpath:db/lookups
    pageMaxSize: 200
    defaultPageSize: 200

  activities:
    classes:
      - com.notraius.modules.core.common.constants.NotraiusActivities
      - org.primarion.module.event.config.EventActivities
      - org.primarion.module.access.external.SharedActivities
  app-public-key: ${APP_PUBLIC_KEY:}
  app-private-key: ${APP_PRIVATE_KEY:}
  name: ${APP_NAME:springboot.notraius}
  baseUrl: ${APP_BASE_URL}
  frontendUrl: ${FRONTEND_URL}
  profile: ${APP_PROFILE}

  flowmap:
    enabled: ${FLOWMAP_ENABLED:false}
    workspace-roots: ${FLOWMAP_WORKSPACE_ROOTS:}
    allow-anonymous: ${FLOWMAP_ALLOW_ANONYMOUS:false}

  fx:
    api-url: ${APP_FX_API_URL:https://api.exchangerate-api.com/v4/latest/USD}
    cache-ttl-seconds: ${APP_FX_CACHE_TTL_SECONDS:3600}

  storage:
    rootDir: ${STORAGE_ROOT_DIR}
    baseUrl: ${STORAGE_BASE_URL}

  primarion:
    baseUrl: ${PRIMARION_BASE_URL}
    userCacheTtlSeconds: ${USER_CACHE_TTL_SECONDS}

  pay:
    baseUrl: ${PAY_BASE_URL}

  notraius:
    notificationsEnabled: ${NOTRAIUS_NOTIFICATIONS_ENABLED}
    # roleStandard, roleAdmin → SharedRoles constants; platformTarget* →
    # static constants
    platformCode: ${NOTRAIUS_PLATFORM_CODE:NOTRAIUS}

  scheduled:
    mutex-ttl-minutes: ${SCHEDULER_MUTEX_TTL_MINUTES:15}

  inter-service:
    pay:
      connect-timeout-ms: ${NOTRAIUS_PAY_CONNECT_TIMEOUT_MS}
      read-timeout-ms: ${NOTRAIUS_PAY_READ_TIMEOUT_MS}

  web:
    cors:
      allowedOrigins: ${CORS_ALLOWED_ORIGINS}
      allowedMethods:
        - GET
        - POST
        - PUT
        - DELETE
        - PATCH
        - OPTIONS
      allowedHeaders: ${CORS_ALLOWED_HEADERS}
      allowCredentials: ${CORS_ALLOW_CREDENTIALS}
      maxAge: ${CORS_MAX_AGE}

  persistence:
    defaultTimeZone: ${APP_DEFAULT_TIMEZONE}

  redis:
    host: ${SPRING_DATA_REDIS_HOST}
    port: ${SPRING_DATA_REDIS_PORT}
    password: ${SPRING_DATA_REDIS_PASSWORD}
    ssl:
      # #CTR-126: Set to true in production. Default is false for dev convenience only.
      # CTR-126 / XS-11: Redis SSL defaults to true for production safety.
      # Set SPRING_DATA_REDIS_USE_SSL=false only for local development.
      enabled: ${SPRING_DATA_REDIS_USE_SSL}
    database: ${SPRING_DATA_REDIS_DATABASE}
    keyPrefix: ${SPRING_DATA_REDIS_KEY_PREFIX}

  shared:
    datasource:
      url: jdbc:postgresql://${SHARED_DB_HOST}:${SHARED_DB_PORT}/${SHARED_DB_NAME}
      username: ${SHARED_DB_USER}
      password: ${SHARED_DB_PASS}
      driverClassName: org.postgresql.Driver
      maximumPoolSize: ${SHARED_HIKARI_MAX_POOL_SIZE}
      minimumIdle: ${SHARED_HIKARI_MIN_IDLE}
      connectionTimeoutMs: ${SHARED_HIKARI_CONNECTION_TIMEOUT}

  task:
    execution:
      pool:
        core-size: ${ASYNC_CORE_POOL_SIZE}
        max-size: ${ASYNC_MAX_POOL_SIZE}
        queue-capacity: ${ASYNC_QUEUE_CAPACITY}
        thread-name-prefix: ${ASYNC_THREAD_NAME_PREFIX}
      shutdown:
        await-termination: ${ASYNC_AWAIT_TERMINATION}
        await-termination-period: ${ASYNC_AWAIT_TERMINATION_PERIOD}
    scheduling:
      pool:
        size: ${SCHEDULER_POOL_SIZE}
        thread-name-prefix: ${SCHEDULER_THREAD_NAME_PREFIX}

  events:
    # Event action engine (scan tick + durable ledger). See EventSchedulerProperties.
    enabled: ${EVENT_SCHEDULER_ENABLED:true}
    scan-interval-ms: ${EVENT_SCAN_INTERVAL_MS:1000}
    initial-delay-ms: ${EVENT_SCAN_INITIAL_DELAY_MS:5000}
    batch: ${EVENT_SCAN_BATCH:100}
    stale-after-ms: ${EVENT_STALE_AFTER_MS:300000}
    reaper-lookback-minutes: ${EVENT_REAPER_LOOKBACK_MINUTES:10}
    executor:
      core-size: ${EVENT_EXECUTOR_CORE_SIZE:4}
      max-size: ${EVENT_EXECUTOR_MAX_SIZE:8}
      queue-capacity: ${EVENT_EXECUTOR_QUEUE_CAPACITY:256}
      thread-prefix: ${EVENT_EXECUTOR_THREAD_PREFIX:event-exec-}

  # Outbound mail (Resend). Sender identity lives under app.security.email.
  email:
    api-key: ${EMAIL_API_KEY:}
    base-url: ${EMAIL_BASE_URL:https://api.resend.com}

  security:
    # #CTR-18: /error removed — Spring Boot error controller can leak stack traces.
    # All endpoints require X-Service-Public-Key header. Only /flowmap/**,
    # /swagger-ui/**, /v3/api-docs/**, and /actuator/** are exempt (handled
    # by PublicKeyValidationFilter).
    publicEndpoints: ${PUBLIC_ENDPOINTS:}
    publicGetEndpoints: ${PUBLIC_GET_ENDPOINTS:}
    publicPostEndpoints: ${PUBLIC_POST_ENDPOINTS:}
    publicPutEndpoints: ${PUBLIC_PUT_ENDPOINTS:}
    publicDeleteEndpoints: ${PUBLIC_DELETE_ENDPOINTS:}
    publicPatchEndpoints: ${PUBLIC_PATCH_ENDPOINTS:}
    # #PURGE: formerly-hardcoded surfaces are env-driven now.
    # Actuator surface (exact/**-pattern matched by PublicKeyValidationFilter).
    actuatorEndpoints: ${PUBLIC_ACTUATOR_ENDPOINTS:}
    # Public authenticity (QR verify) prefixes — prefix-matched, per-IP
    # rate-limited inside the controllers. Platform-wide registry: a host
    # simply ignores prefixes it does not serve.
    publicAuthenticityEndpoints: ${PUBLIC_AUTHENTICITY_ENDPOINTS:}
    # Machine-readable OpenAPI doc prefixes (public cache policy).
    openApiDocPrefixes: ${SECURITY_OPENAPI_DOC_PREFIXES:}
    # Cacheable static/UI asset prefixes (public cache policy).
    cacheableStaticPrefixes: ${SECURITY_CACHEABLE_STATIC_PREFIXES:}
    # Relaxed-CSP path prefixes (dev-only UIs like FlowMap). The relaxed CSP
    # VALUE is env-driven via SECURITY_RELAXED_CSP (read direct from env — a
    # YAML :empty default would bind an empty string over the code default).
    relaxedCspPrefixes: ${SECURITY_RELAXED_CSP_PREFIXES:}
    cacheMaxAgeSeconds: ${SECURITY_CACHE_MAX_AGE:300}
    # Validated service public key is enough here — no session. Per-operation
    # rules (lookup YAML tiers) still apply inside the endpoint.
    keyAuthorizedEndpoints: ${KEY_AUTHORIZED_ENDPOINTS:}

    # #AUTH-CENTRAL: keys are PER-SERVICE — this is THIS service's own HMAC
    # key (unique; it must NOT match the other services'). Platform session
    # tokens are signed only by primarion and verified via primarion
    # introspection, so no other service ever needs this value.
    hmacKey: ${HMAC_KEY}
    encryptionKey: ${ENCRYPTION_KEY}
    # CTR-13: Behind a load balancer, list the LB IPs here.
    # Without this, all IP-based rate limits collapse onto the LB IP.
    trustedProxies: ${TRUSTED_PROXIES}
    # CTR-14 / XS-12: Enable when production domains are committed.
    hstsEnabled: ${HSTS_ENABLED}

    password:
      minLength: ${PASSWORD_MIN_LENGTH:8}
      maxLength: ${PASSWORD_MAX_LENGTH:255}
      requireUppercase: ${PASSWORD_REQUIRE_UPPERCASE:true}
      requireLowercase: ${PASSWORD_REQUIRE_LOWERCASE:true}
      requireDigits: ${PASSWORD_REQUIRE_DIGITS:true}
      requireSpecialChars: ${PASSWORD_REQUIRE_SPECIAL:true}
      historyCount: ${PASSWORD_HISTORY_COUNT:5}

    email:
      senderEmail: ${EMAIL_SENDER:}
      senderName: ${EMAIL_SENDER_NAME:}
      supportEmail: ${EMAIL_SUPPORT:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,loggers
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
    loggers:
      # Writable anonymously (/actuator/** is exempt from the service-key
      # filter) — off by default; re-enable per-environment when needed.
      enabled: ${ACTUATOR_LOGGERS_ENABLED:false}
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: http://localhost:4318/v1/traces

logging:
  level:
    org.apache.tomcat: WARN
    com.zaxxer.hikari: WARN
    org.flywaydb: WARN
    org.hibernate: WARN
    org.hibernate.orm.deprecation: ERROR
    o.a.catalina: WARN
    o.a.coyote: WARN
    o.s.c.events.SpringDocAppInitializer: ERROR
    o.f.c.i.s.DefaultSqlScriptExecutor: ERROR

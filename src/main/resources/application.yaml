spring:
  config:
    import: classpath:endpoints.yaml
  application:
    name: ${APP_NAME:springboot.notraius}

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASS}
    driver-class-name: org.postgresql.Driver
    hikari:
      # #CTR-91: Pool must accommodate Tomcat thread count.
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE}
      minimum-idle: ${HIKARI_MIN_IDLE}
      connection-timeout: ${HIKARI_CONNECTION_TIMEOUT}
      idle-timeout: ${HIKARI_IDLE_TIMEOUT}
      max-lifetime: ${HIKARI_MAX_LIFETIME}
      validation-timeout: ${HIKARI_VALIDATION_TIMEOUT}

  # Every paged endpoint resolves its Pageable through Spring's resolver, and
  # that resolver is the only place a ceiling can be enforced once for all of
  # them. Without one, `?size=1000000` is honoured: a single anonymous GET can
  # ask the database for a million rows and force them through the mapper. The
  # public read tier makes that a stranger's decision, so the cap is explicit
  # and env-tunable rather than left to the framework default (which is
  # unlimited). Raising max-page-size is a capacity decision, not a client one.
  data:
    web:
      pageable:
        default-page-size: ${PAGE_DEFAULT_SIZE:20}
        max-page-size: ${PAGE_MAX_SIZE:100}
    jpa:
      repositories:
        enabled: false
    redis:
      repositories:
        enabled: false

  jpa:
    hibernate:
      # Flyway owns the schema; Hibernate never generates DDL.
      ddl-auto: none
    open-in-view: false
    show-sql: ${APP_SHOW_SQL}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        globally_quoted_identifiers: true
        jdbc.time_zone: UTC
        # Notraius domain entities carry an explicit @Table schema; the shared
        # Attachment row model (no @Table schema) lands in the notraius schema.
        # Geo reference entities (states, countries) and the Media catalog are
        # served by the shared lookup datasource (app.shared.datasource).
        default_schema: notraius

  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: notraius
    default-schema: notraius
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: false

  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE}
      max-request-size: ${MAX_REQUEST_SIZE}

springdoc:
  api-docs:
    path: ${SPRINGDOC_API_DOCS_PATH}
    # Off unless explicitly enabled (SPRINGDOC_ENABLED=true).
    enabled: ${SPRINGDOC_ENABLED:false}
  swagger-ui:
    path: ${SPRINGDOC_SWAGGER_UI_PATH}
    deep-linking: ${SPRINGDOC_SWAGGER_UI_DEEP_LINKING}
    display-request-duration: ${SPRINGDOC_SWAGGER_UI_DISPLAY_REQUEST_DURATION}
    syntax-highlight:
      activated: ${SPRINGDOC_SWAGGER_UI_SYNTAX_HIGHLIGHT}
    tags-sorter: ${SPRINGDOC_SWAGGER_UI_TAGS_SORTER}
    operations-sorter: ${SPRINGDOC_SWAGGER_UI_OPERATIONS_SORTER}
    doc-expansion: ${SPRINGDOC_SWAGGER_UI_DOC_EXPANSION}
    filter: ${SPRINGDOC_SWAGGER_UI_FILTER}
    show-extensions: ${SPRINGDOC_SWAGGER_UI_SHOW_EXTENSIONS}

server:
  port: ${PORT}
  shutdown: graceful
  max-http-request-header-size: ${MAX_HTTP_REQUEST_HEADER_SIZE}
  tomcat:
    threads:
      max: ${TOMCAT_MAX_THREADS}
      min-spare: ${TOMCAT_MIN_SPARE_THREADS}
    max-connections: ${TOMCAT_MAX_CONNECTIONS}
    accept-count: ${TOMCAT_ACCEPT_COUNT}
    connection-timeout: ${TOMCAT_CONNECTION_TIMEOUT}

app:
  app-code: ${APP_CODE}

  # Flow engine — the pool of events. Off until a broker exists; set
  # FLOW_ENABLED=true + FLOW_BOOTSTRAP_SERVERS to wake the relay.
  flow:
    enabled: ${FLOW_ENABLED:false}
    bootstrap-servers: ${FLOW_BOOTSTRAP_SERVERS:}

  lookup:
    basePath: /api/v1/lookups
    dir: classpath:db/lookups
    pageMaxSize: 200
    defaultPageSize: 200

  activities:
    classes:
      - com.notraius.modules.core.common.constants.NotraiusActivities
      - org.primarion.module.event.config.EventActivities
      - org.primarion.module.access.external.SharedActivities
    # [NEW-52] The webhook EVENT vocabulary — every (family, word) pair the
    # dispatchers can emit is seeded as a subscription-target permission row
    # (sentinel SYSTEM|GTE; endpoint-declared pairs keep their own policy).
    event-classes:
      - com.notraius.modules.core.common.constants.NotraiusWebhookEvents
    # [estate standard] The chat-module families belong to the surface that
    # hosts them; every host excludes them from its local activity registry
    # (same line in pay/logistic/contract/primarion).
    exclude: Chat Member Request Invite
  app-public-key: ${APP_PUBLIC_KEY:}
  app-private-key: ${APP_PRIVATE_KEY:}
  name: ${APP_NAME:springboot.notraius}
  baseUrl: ${APP_BASE_URL}
  frontendUrl: ${FRONTEND_URL}
  profile: ${APP_PROFILE:dev}

  flowmap:
    enabled: ${FLOWMAP_ENABLED:false}
    workspace-roots: ${FLOWMAP_WORKSPACE_ROOTS:}

  fx:
    api-url: ${APP_FX_API_URL:https://api.exchangerate-api.com/v4/latest/USD}
    cache-ttl-seconds: ${APP_FX_CACHE_TTL_SECONDS:3600}

  engagement:
    # The learning loop's weights (V46). Reaction intensity is NOT configured
    # here: the frontend fills a 0–100 score per reaction (50 = neutral), the
    # only signal a kind can carry since no one can predict which kinds a
    # deployment will declare. Decay cadence is the operator's 3-months-max rule.
    dwell-threshold-ms: ${APP_ENGAGEMENT_DWELL_THRESHOLD_MS:30000}
    dwell-nudge: ${APP_ENGAGEMENT_DWELL_NUDGE:0.25}
    collection-nudge: ${APP_ENGAGEMENT_COLLECTION_NUDGE:1.0}
    comment-nudge: ${APP_ENGAGEMENT_COMMENT_NUDGE:0.1}
    affinity-decay-factor: ${APP_ENGAGEMENT_AFFINITY_DECAY_FACTOR:0.5}
    affinity-decay-delay-ms: ${APP_ENGAGEMENT_AFFINITY_DECAY_DELAY_MS:7776000000}
    affinity-decay-initial-delay-ms: ${APP_ENGAGEMENT_AFFINITY_DECAY_INITIAL_DELAY_MS:60000}

  storage:
    rootDir: ${STORAGE_ROOT_DIR}
    baseUrl: ${STORAGE_BASE_URL}

  primarion:
    baseUrl: ${PRIMARION_BASE_URL}
    userCacheTtlSeconds: ${USER_CACHE_TTL_SECONDS}

  pay:
    baseUrl: ${PAY_BASE_URL}

  notraius:
    notificationsEnabled: ${NOTRAIUS_NOTIFICATIONS_ENABLED}
    payBaseUrl: ${PAY_BASE_URL}
    logisticBaseUrl: ${LOGISTIC_BASE_URL}
    # PLAN 5.1's fences: silence never keeps money, the numbers ride the env.
    visitRequestExpiryHours: ${NOTRAIUS_VISIT_REQUEST_EXPIRY_HOURS:24}
    visitSweepLookbackHours: ${NOTRAIUS_VISIT_SWEEP_LOOKBACK_HOURS:720}
    visitReeditWindowMinutes: ${NOTRAIUS_VISIT_REEDIT_WINDOW_MINUTES:30}
    visitConfirmationFenceHours: ${NOTRAIUS_VISIT_CONFIRMATION_FENCE_HOURS:72}
    # PLAN 5.3's clocks: the counter-signature window, the assessment door, and
    # 5.4's reschedule/cancel horizon — the operator's numbers, the env's to set.
    visitStartConfirmWindowMinutes: ${NOTRAIUS_VISIT_START_CONFIRM_WINDOW_MINUTES:10}
    visitAssessmentWindowMinutes: ${NOTRAIUS_VISIT_ASSESSMENT_WINDOW_MINUTES:60}
    visitCancelHorizonHours: ${NOTRAIUS_VISIT_CANCEL_HORIZON_HOURS:24}
    # PLAN 6.1's birth clock: a PENDING lease nobody confirms in 72 hours
    # expires, its held matrix refunds split by split, the property returns.
    leaseStalenessWindowHours: ${NOTRAIUS_LEASE_STALENESS_WINDOW_HOURS:72}
    leaseSweepLookbackHours: ${NOTRAIUS_LEASE_SWEEP_LOOKBACK_HOURS:720}
    # PLAN 6.2–6.7's clocks: the calendar's horizon, the notice window, the
    # vacation's months, the move-out week, the settlement fortnight and the
    # reconversion pace — the operator's numbers, the env's to set.
    leaseScheduleHorizonPeriods: ${NOTRAIUS_LEASE_SCHEDULE_HORIZON_PERIODS:6}
    leaseNoticeResponseHours: ${NOTRAIUS_LEASE_NOTICE_RESPONSE_HOURS:72}
    leaseVacationMonths: ${NOTRAIUS_LEASE_VACATION_MONTHS:3}
    leaseMoveOutWindowDays: ${NOTRAIUS_LEASE_MOVE_OUT_WINDOW_DAYS:7}
    leaseSettlementWindowDays: ${NOTRAIUS_LEASE_SETTLEMENT_WINDOW_DAYS:14}
    leaseReconversionMultiplier: ${NOTRAIUS_LEASE_RECONVERSION_MULTIPLIER:2.5}
    leaseDepositGraceMultiplier: ${NOTRAIUS_LEASE_DEPOSIT_GRACE_MULTIPLIER:2}
    # The sweeps' paging: one page of work keys per read, one budget of settled
    # rows per pass. A worklist larger than the budget resumes from the ledger's
    # cursor on the next tick instead of being read into memory whole.
    sweepPageSize: ${NOTRAIUS_SWEEP_PAGE_SIZE:500}
    sweepRowBudget: ${NOTRAIUS_SWEEP_ROW_BUDGET:5000}
    # roleStandard, roleAdmin → SharedRoles constants; platformTarget* →
    # static constants
    platformCode: ${NOTRAIUS_PLATFORM_CODE:NOTRAIUS}

  scheduled:
    mutex-ttl-minutes: ${SCHEDULER_MUTEX_TTL_MINUTES:15}

  inter-service:
    pay:
      connect-timeout-ms: ${NOTRAIUS_PAY_CONNECT_TIMEOUT_MS}
      read-timeout-ms: ${NOTRAIUS_PAY_READ_TIMEOUT_MS}
    logistic:
      connect-timeout-ms: ${NOTRAIUS_LOGISTIC_CONNECT_TIMEOUT_MS}
      read-timeout-ms: ${NOTRAIUS_LOGISTIC_READ_TIMEOUT_MS}
    assessment:
      connect-timeout-ms: ${NOTRAIUS_ASSESSMENT_CONNECT_TIMEOUT_MS}
      read-timeout-ms: ${NOTRAIUS_ASSESSMENT_READ_TIMEOUT_MS}

  web:
    cors:
      allowedOrigins: ${CORS_ALLOWED_ORIGINS}
      allowedMethods:
        - GET
        - POST
        - PUT
        - DELETE
        - PATCH
        - OPTIONS
      allowedHeaders: ${CORS_ALLOWED_HEADERS}
      allowCredentials: ${CORS_ALLOW_CREDENTIALS}
      maxAge: ${CORS_MAX_AGE}

  persistence:
    defaultTimeZone: ${APP_DEFAULT_TIMEZONE}

  redis:
    host: ${SPRING_DATA_REDIS_HOST}
    port: ${SPRING_DATA_REDIS_PORT}
    password: ${SPRING_DATA_REDIS_PASSWORD}
    ssl:
      # #CTR-126: Set to true in production. Default is false for dev convenience only.
      # CTR-126 / XS-11: Redis SSL defaults to true for production safety.
      # Set SPRING_DATA_REDIS_USE_SSL=false only for local development.
      enabled: ${SPRING_DATA_REDIS_USE_SSL}
    database: ${SPRING_DATA_REDIS_DATABASE}
    keyPrefix: ${SPRING_DATA_REDIS_KEY_PREFIX}

  shared:
    datasource:
      url: jdbc:postgresql://${SHARED_DB_HOST}:${SHARED_DB_PORT}/${SHARED_DB_NAME}
      username: ${SHARED_DB_USER}
      password: ${SHARED_DB_PASS}
      driverClassName: org.postgresql.Driver
      maximumPoolSize: ${SHARED_HIKARI_MAX_POOL_SIZE}
      minimumIdle: ${SHARED_HIKARI_MIN_IDLE}
      connectionTimeoutMs: ${SHARED_HIKARI_CONNECTION_TIMEOUT}

  task:
    execution:
      pool:
        core-size: ${ASYNC_CORE_POOL_SIZE}
        max-size: ${ASYNC_MAX_POOL_SIZE}
        queue-capacity: ${ASYNC_QUEUE_CAPACITY}
        thread-name-prefix: ${ASYNC_THREAD_NAME_PREFIX}
      shutdown:
        await-termination: ${ASYNC_AWAIT_TERMINATION}
        await-termination-period: ${ASYNC_AWAIT_TERMINATION_PERIOD}
    scheduling:
      pool:
        size: ${SCHEDULER_POOL_SIZE}
        thread-name-prefix: ${SCHEDULER_THREAD_NAME_PREFIX}

  events:
    # Event action engine (scan tick + durable ledger). See EventSchedulerProperties.
    enabled: ${EVENT_SCHEDULER_ENABLED:true}
    scan-interval-ms: ${EVENT_SCAN_INTERVAL_MS:1000}
    initial-delay-ms: ${EVENT_SCAN_INITIAL_DELAY_MS:5000}
    batch: ${EVENT_SCAN_BATCH:100}
    stale-after-ms: ${EVENT_STALE_AFTER_MS:300000}
    reaper-lookback-minutes: ${EVENT_REAPER_LOOKBACK_MINUTES:10}
    executor:
      core-size: ${EVENT_EXECUTOR_CORE_SIZE:4}
      max-size: ${EVENT_EXECUTOR_MAX_SIZE:8}
      queue-capacity: ${EVENT_EXECUTOR_QUEUE_CAPACITY:256}
      thread-prefix: ${EVENT_EXECUTOR_THREAD_PREFIX:event-exec-}

  # Outbound mail (Resend). Sender identity lives under app.security.email.
  email:
    api-key: ${EMAIL_API_KEY:}
    base-url: ${EMAIL_BASE_URL:https://api.resend.com}

  security:
    # Doors are declared on the handler. With strict-doors on, a handler with
    # no @PreAuthorize fails the boot instead of silently existing ungated.
    strictDoors: ${STRICT_DOORS:true}
    # #CTR-18: /error removed — Spring Boot error controller can leak stack traces.
    # Every request needs X-Service-Public-Key unless its handler declares
    # ANONYMOUS. Actuator and the OpenAPI/Swagger surface are the only
    # infrastructure allowlist (InfraPublicPaths) — there is no env door list.
    # may browse, plus the targeted config lookups an anonymous renderer follows
    # (asset DTOs carry ids, not config payloads — N1). Empty by default, like
    # than accidentally open. The exact endpoint list lives in .env.example —
    # variable occupies. Every config LIST, the amenity submission queue and
    # every visit/lease record stay out of it.
    # permitAll) IS the gate and each handler pays an IP-scoped throttle.
    # id-addressed read, a moderation queue beside a catalogue read). Named in
    # .env.example, never in code; empty by default. The handler's own
    # @PreAuthorize still decides the authority — this only fixes the status a
    # Cacheable static/UI asset prefixes (public cache policy).
    cacheableStaticPrefixes: ${SECURITY_CACHEABLE_STATIC_PREFIXES:}
    # Relaxed-CSP path prefixes (dev-only UIs like FlowMap). The relaxed CSP
    # VALUE is env-driven via SECURITY_RELAXED_CSP (read direct from env — a
    # YAML :empty default would bind an empty string over the code default).
    relaxedCspPrefixes: ${SECURITY_RELAXED_CSP_PREFIXES:}
    cacheMaxAgeSeconds: ${SECURITY_CACHE_MAX_AGE:300}
    # rules (lookup YAML tiers) still apply inside the endpoint.

    # #AUTH-CENTRAL: keys are PER-SERVICE — this is THIS service's own HMAC
    # key (unique; it must NOT match the other services'). Platform session
    # tokens are signed only by primarion and verified via primarion
    # introspection, so no other service ever needs this value.
    hmacKey: ${HMAC_KEY}
    encryptionKey: ${ENCRYPTION_KEY}
    # CTR-13: Behind a load balancer, list the LB IPs here.
    # Without this, all IP-based rate limits collapse onto the LB IP.
    trustedProxies: ${TRUSTED_PROXIES}
    # CTR-14 / XS-12: Enable when production domains are committed.
    hstsEnabled: ${HSTS_ENABLED}

    password:
      minLength: ${PASSWORD_MIN_LENGTH:8}
      maxLength: ${PASSWORD_MAX_LENGTH:255}
      requireUppercase: ${PASSWORD_REQUIRE_UPPERCASE:true}
      requireLowercase: ${PASSWORD_REQUIRE_LOWERCASE:true}
      requireDigits: ${PASSWORD_REQUIRE_DIGITS:true}
      requireSpecialChars: ${PASSWORD_REQUIRE_SPECIAL:true}
      historyCount: ${PASSWORD_HISTORY_COUNT:5}

    email:
      senderEmail: ${EMAIL_SENDER:}
      senderName: ${EMAIL_SENDER_NAME:}
      supportEmail: ${EMAIL_SUPPORT:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,loggers
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
    loggers:
      # Writable anonymously (/actuator/** is exempt from the service-key
      # filter) — off by default; re-enable per-environment when needed.
      enabled: ${ACTUATOR_LOGGERS_ENABLED:false}
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: http://localhost:4318/v1/traces

logging:
  level:
    org.apache.tomcat: WARN
    com.zaxxer.hikari: WARN
    org.flywaydb: WARN
    org.hibernate: WARN
    org.hibernate.orm.deprecation: ERROR
    o.a.catalina: WARN
    o.a.coyote: WARN
    o.s.c.events.SpringDocAppInitializer: ERROR
    o.f.c.i.s.DefaultSqlScriptExecutor: ERROR

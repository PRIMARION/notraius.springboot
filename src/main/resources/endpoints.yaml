# Endpoints referenced by this microservice, resolved 100% dynamically through
# the shared EndpointRegistry. Keys: <service>.<module>.<method>.
# Values: { method, endpoint }.
# Every surface the shared code owns or calls is declared here — even the ones
# this service exposes itself — so shared clients (UserClient,
# SubscriptionPayClient) and the e2e suites resolve paths from this file
# instead of hardcoding them.
endpoints:
  notraius:
    subscription:
      current:
        method: GET
        endpoint: /api/v1/subscriptions/current
      subscribe:
        method: POST
        endpoint: /api/v1/subscriptions/subscribe
      cancel:
        method: POST
        endpoint: /api/v1/subscriptions/cancel
      preferencesGet:
        method: GET
        endpoint: /api/v1/subscriptions/preferences
      preferencesUpdate:
        method: PUT
        endpoint: /api/v1/subscriptions/preferences
  # The property's anchors are resolved through the two hosts that own them:
  # the location (and thereby the state) by logistics, the currency by pay's
  # generic lookup surface. notraius mirrors neither table.
  logistic:
    location:
      get:
        method: GET
        endpoint: /api/v1/logistic/locations/{locationId}
  pay:
    subscription:
      balance:
        method: GET
        endpoint: /api/v1/pay/subscriptions/users/{userId}/balance
      debit:
        method: POST
        endpoint: /api/v1/pay/subscriptions/debit
    payment:
      findCurrency:
        method: POST
        endpoint: /api/v1/lookups/execute
      # [new-PAY standard] The internal S2S surface after PLAN.md §3.2: the
      # birth door takes the FULL split matrix (custodial=true mints per-split
      # escrows), credit is conveyed later with the per-split release, and the
      # S2S settle announce is a 410 tombstone (settlePayment key withdrawn).
      createPayment:
        method: POST
        endpoint: /api/v1/pay/internal/payments
      getPaymentByReference:
        method: GET
        endpoint: /api/v1/pay/internal/payments/reference/{referenceId}
      # UPGRADE #58 amendment: one payment PER CURRENCY per invoice — the
      # list-shaped fetch of a reference returns every currency row.
      getPaymentsByReference:
        method: GET
        endpoint: /api/v1/pay/internal/payments/reference/{referenceId}/all
      # PLAN.md v2 Part 5: money received OUTSIDE pay's rails, recorded
      # through the identical machinery by a host service (the row takes
      # the CALLING platform's stamp at birth).
      recordExternal:
        method: POST
        endpoint: /api/v1/pay/internal/payments/external
      # The per-split custody engines (§7.5.1 SERVICE lanes): release
      # conveys the split's credit to its beneficiary, refund returns the
      # whole escrow to the funding wallet. One escrow, never an amount.
      releaseSplit:
        method: POST
        endpoint: /api/v1/pay/internal/payments/{paymentId}/splits/{splitId}/release
      refundSplit:
        method: POST
        endpoint: /api/v1/pay/internal/payments/{paymentId}/splits/{splitId}/refund
      refundPayment:
        method: POST
        endpoint: /api/v1/pay/internal/payments/{paymentId}/refund
  primarion:
    auth:
      introspect:
        method: POST
        endpoint: /api/v1/internal/auth/introspect
    user:
      findById:
        method: GET
        endpoint: /api/v1/primarion/users/{id}
      findByEmail:
        method: GET
        endpoint: /api/v1/primarion/users/email/{email}
      findSystemUser:
        method: GET
        endpoint: /api/v1/primarion/users/system/user
      findVerifiedUsers:
        method: GET
        endpoint: /api/v1/primarion/users/kyc/verified
      isKycVerified:
        method: GET
        endpoint: /api/v1/primarion/users/{id}/kyc/verified
    reputation:
      getSummary:
        method: GET
        endpoint: /api/v1/primarion/reputation/users/{userId}
      # Every configured axis answers here, scored or not — the only surface
      # that reveals the axis vocabulary without mirroring primarion's table.
      axisScores:
        method: GET
        endpoint: /api/v1/primarion/reputation/users/{userId}/scores
    assessment:
      createAssessment:
        method: POST
        endpoint: /api/v1/primarion/reputation/users/{userId}/assessments
      listAssessments:
        method: GET
        endpoint: /api/v1/primarion/reputation/assessments
      getAssessment:
        method: GET
        endpoint: /api/v1/primarion/reputation/assessments/{id}
